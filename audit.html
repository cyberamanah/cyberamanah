<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free 2-Minute Server Health Audit | CyberAmanah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="text-xl font-bold tracking-tight"><span class="text-emerald-500">🛡️ Cyber</span>Amanah</a>
      <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-slate-300">
        <a href="services.html" class="hover:text-emerald-400 transition">Services</a>
        <a href="solutions.html" class="hover:text-emerald-400 transition">Solutions</a>
        <a href="about.html" class="hover:text-emerald-400 transition">About</a>
        <a href="audit.html" class="text-emerald-400 font-bold">Free Audit</a>
      </nav>
    </div>
  </header>

  <section class="max-w-3xl mx-auto px-6 py-16">
    <div class="text-center mb-12">
      <h1 class="text-3xl md:text-4xl font-extrabold text-white mb-4">Free 2-Minute Linux Health Check</h1>
      <p class="text-slate-400">Receive an open-source, 100% read-only local audit script. Zero root passwords required.</p>
    </div>

    <!-- Form -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8">
      <form action="/api/audit-request" method="POST" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Your Name / Title</label>
          <input type="text" name="name" required placeholder="e.g., Alex (DevOps Lead)" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Work Email Address</label>
          <input type="email" name="email" required placeholder="alex@company.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Server Operating System & Provider</label>
          <input type="text" name="server_info" required placeholder="e.g., Ubuntu 22.04 on AWS / Hetzner" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">WhatsApp Number (Optional for instant delivery)</label>
          <input type="text" name="whatsapp" placeholder="+44 7000 000000" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500">
        </div>

        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-4 rounded-lg transition">
          Request Free Audit Script
        </button>
      </form>

      <div class="mt-8 text-center pt-6 border-t border-slate-800">
        <p class="text-xs text-slate-500">Prefer direct communication?</p>
        <a href="https://wa.me/12345678900?text=Hi%20CyberAmanah,%20please%20send%20me%20the%20audit%20script%20directly." class="text-emerald-400 text-sm font-semibold hover:underline mt-1 inline-block">
          Request Script via WhatsApp →
        </a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="border-t border-slate-800 mt-20 py-10 bg-slate-950 text-center text-slate-500 text-sm">
    <p>© CyberAmanah. All rights reserved.</p>
  </footer>
</body>
</html>
